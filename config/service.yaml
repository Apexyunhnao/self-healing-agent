services:
  mock_svc:
    display: Mock 测试服务
    probe:
      type: http
      url: "http://127.0.0.1:${MOCK_PORT}/healthz"
      timeout: 5
    process:
      pattern: "mock_server.py"      # 进程匹配（wmic CommandLine）
      expected_count: 1              # ProcessProbe 期望进程数，>1 → process_duplicate
    resources:                       # ResourceProbe 阈值
      cpu_threshold_pct: 80
      mem_threshold_mb: 200
    repair:
      actions: [restart, kill_stale, cleanup_logs, escalate]
    verifier:
      type: http
      url: "http://127.0.0.1:${MOCK_PORT}/healthz"
      retries: 3
      samples: 3                     # 连续 3 次 200 才算恢复（防间歇故障骗过验证器）
      sample_interval: 0.5
    start_command: ["python", "mockenv/mock_server.py", "--port", "${MOCK_PORT}", "--name", "mock_svc", "--daemon"]
    state_file: "mockenv/state/mock_svc.json"   # restart 前删除 = 清运行时状态（模拟重启清内存）
    log_dir: "mockenv/state"
    config_dir: null
  rag_qa:
    display: RAG 知识库（真实服务，只读探针）
    probe:
      type: http
      url: "http://127.0.0.1:8000/healthz"
      timeout: 5
    process:
      pattern: "uvicorn"
    repair:
      actions: [escalate]           # 真实服务 v1 只升级人工，不自动重启
    verifier:
      type: http
      url: "http://127.0.0.1:8000/healthz"
      retries: 2
    start_command: null
    log_dir: null
    config_dir: null
